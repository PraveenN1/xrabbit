[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xrabbit"
version = "0.1.0"
description = "A clean, developer-friendly Python SDK wrapper for RabbitMQ"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pika>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xrabbit*"]